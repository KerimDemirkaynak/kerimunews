name: Share on Threads

on:
  schedule:
    - cron: '*/30 * * * *' # Yarım saatte bir çalışır
  workflow_dispatch:

jobs:
  share:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Threads Share Script
        env:
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python threads_share.py

      - name: Commit and push tracking files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add last_posted_threads.txt threads_token.txt || echo "No files to add"
          git commit -m "chore: update threads tracking states [skip ci]" || echo "No changes to commit"
          git push
