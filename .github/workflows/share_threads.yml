name: Share News to Threads

on:
  # Her gün Türkiye saatiyle 20:00'de çalışması için 17:00 UTC ayarlandı
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Share to Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
        run: python threads_share.py

      - name: Commit and push tracking files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # Sadece takip dosyasını ekle
          git add last_posted_threads.txt || echo "No files to add"
          
          # Değişiklik varsa commit at
          git commit -m "chore: update threads tracking states [skip ci]" || echo "No changes to commit"
          
          # Remote'daki değişiklikleri al ve üzerine ekle
          git pull --rebase origin main
          
          # Güncel halini pushla
          git push origin main
