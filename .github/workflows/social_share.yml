name: Share News to All Socials

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'

jobs:
  share-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dosyaları Github'a kaydedebilmek için yazma izni
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt içinde mastodon, atproto vb. olduğunu varsayıyoruz
          pip install -r requirements.txt
          # Threads için request eksik kalmasın diye ekliyoruz
          pip install requests 
      
      # 1. BLUESKY PAYLAŞIMI
      - name: Post to Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: python bluesky_share.py
        # continue-on-error: true sayesinde bu adım hata verse bile diğer platformlara geçilir
        continue-on-error: true

      # 2. MASTODON PAYLAŞIMI
      - name: Post to Mastodon
        env:
          MASTODON_API_BASE_URL: ${{ secrets.MASTODON_API_BASE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: python mastodon_share.py
        continue-on-error: true

      # 3. THREADS PAYLAŞIMI
      - name: Share to Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
        run: python threads_share.py
        continue-on-error: true
        
      # EN SON ADIM: TÜM TXT DOSYALARINI TEK SEFERDE KAYDET
      - name: Commit and push all tracking files
        if: always() # Yukarıdaki scriptlerden biri çökse bile çalışanların datasını kaydet
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 3 botun da takip dosyasını eklemeye çalış (varsa ekler, yoksa hata vermez)
          git add last_posted_id.txt last_posted_mastodon.txt last_posted_threads.txt || true
          
          # Sadece değişen bir şey varsa commit ve push işlemlerini yap
          if ! git diff --staged --quiet; then
            git commit -m "chore: sosyal medya botları takip dosyaları güncellendi [skip ci]"
            # Garanti olsun diye pushlamadan önce değişiklikleri çek
            git pull --rebase origin main
            git push origin main
          else
            echo "Değişiklik yok, push işlemi atlandı."
          fi
