name: Share on Bluesky

on:
  workflow_dispatch: # 1. MANUEL TETİKLEME: GitHub Actions sekmesinde "Run workflow" butonu çıkarır.
  schedule:
    - cron: '0 17 * * *' # 2. ZAMANLANMIŞ GÖREV: Her gün UTC 17:00 (Türkiye saati ile 20:00) çalışır.

jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Post to Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: python bluesky_share.py
