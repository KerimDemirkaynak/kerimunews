name: Share on Bluesky

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'

jobs:
  share:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dosyayı Github'a kaydedebilmek için yazma izni

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Post to Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: python bluesky_share.py

      # BOTUN NEREDE KALDIĞINI UNUTMAMASI İÇİN KAYDETME ADIMI
      - name: Commit and push last posted ID
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add last_posted_id.txt
          # Eğer dosyada değişiklik varsa kaydet ve Github'a gönder
          git diff --staged --quiet || (git commit -m "Son paylasilan Bluesky ID'si guncellendi" && git push)
