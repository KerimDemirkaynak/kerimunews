<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haber Detayı - Kerimu Animasyon Haberleri</title>
    <link rel="icon" href="https://t2.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=http://animenewsnetwork.com/&size=16">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --header-bg: #0b1120;
            --anime-tag: #ec4899;
            --cartoon-tag: #f59e0b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        
        header { background-color: var(--header-bg); border-bottom: 1px solid #334155; }
        .header-content { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; padding: 1.2rem 1rem; gap: 1rem; }
        .logo-container { display: flex; align-items: center; gap: 8px; color: var(--text-main); text-decoration: none; }
        .logo-icon { display: flex; align-items: center; color: var(--accent); }
        header h1 { font-size: 1.25rem; font-weight: 600; margin: 0; }
        
        /* GÜNCELLENEN ANA LAYOUT: Masaüstünde yan yana dizilim sağlar */
        main { flex: 1; max-width: 1200px; margin: 2rem auto; padding: 0 1rem; width: 100%; }
        .page-layout { display: grid; grid-template-columns: 1fr 340px; gap: 2rem; align-items: start; }
        .content-area { min-width: 0; } /* Taşmayı önlemek için */

        .article-container { background-color: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid #334155; margin-bottom: 2rem; }
        .article-image { width: 100%; max-height: 400px; object-fit: cover; display: block; }
        
        .article-header { padding: 2rem; }
        .article-title { font-size: 2rem; color: #fff; margin-bottom: 0; line-height: 1.3; }
        
        .article-sub-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            padding: 1.5rem 2rem;
            border-top: 1px solid #334155;
            border-bottom: 1px solid #334155;
        }
        .article-source { color: var(--text-muted); font-size: 0.9rem; text-align: right; }
        
        .article-body { padding: 2rem; color: #e2e8f0; font-size: 1.1rem; line-height: 1.8; }
        
        .original-link { display: inline-block; margin-top: 1rem; color: var(--accent); text-decoration: none; font-weight: bold; }
        .original-link:hover { text-decoration: underline; }

        /* SOSYAL MEDYA PAYLAŞIM BUTONLARI CSS */
        .social-share {
            display: flex; align-items: center; flex-wrap: wrap; gap: 12px;
            margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid #334155;
        }
        .share-text { font-weight: 600; color: var(--text-muted); white-space: nowrap; }
        .share-buttons-container { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

        .share-btn {
            display: inline-flex; align-items: center; justify-content: center;
            width: 40px; height: 40px; border-radius: 50%; color: #fff; text-decoration: none; font-size: 1.1rem;
            transition: transform 0.2s, opacity 0.2s; border: none; cursor: pointer; margin: 0;
        }
        .share-btn:hover { transform: translateY(-3px); opacity: 0.9; }
        .btn-twitter { background-color: #000000; border: 1px solid #334155; }
        .btn-facebook { background-color: #1877F2; }
        .btn-whatsapp { background-color: #25D366; }
        .btn-telegram { background-color: #0088cc; }
        .btn-copy { background-color: #475569; }

        /* YAZAR PROFİLİ STİLLERİ */
        .author-meta-top { display: flex; align-items: center; gap: 12px; }
        .author-meta-top img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
        .author-info { display: flex; flex-direction: column; }
        .author-name { color: #fff; font-weight: 700; font-size: 1.05rem; text-decoration: none; }
        .author-name:hover { text-decoration: underline; }
        .author-date { color: var(--text-muted); font-size: 0.9rem; }

        .author-card {
            display: flex; align-items: center; background-color: #1a2235; border: 1px solid #334155;
            border-radius: 12px; padding: 1.5rem; margin-top: 2.5rem; gap: 1.5rem;
        }
        .author-card img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; }
        .author-card-text { flex: 1; }
        .author-card-name { color: #3b82f6; font-size: 1.3rem; font-weight: bold; text-decoration: none; display: block; margin-bottom: 0.4rem; }
        .author-card-name:hover { text-decoration: underline; }
        .author-card-text p { color: #cbd5e1; font-size: 0.95rem; margin: 0; line-height: 1.5; }

        /* YENİ SAĞ WIDGET PANELİ STİLLERİ */
        .sidebar-area {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            position: sticky;
            top: 2rem; /* Kaydırdıkça ekranda sabit kalır */
        }
        .sidebar-widget { background-color: var(--card-bg); border-radius: 12px; padding: 1.5rem; border: 1px solid #334155; }
        .widget-title { font-size: 1.05rem; font-weight: bold; text-transform: uppercase; color: #3b82f6; margin-bottom: 1.2rem; letter-spacing: 0.5px; border-left: 3px solid #3b82f6; padding-left: 8px; line-height: 1; }
        
        /* Haber Listesi Widget */
        .widget-list { display: flex; flex-direction: column; gap: 1rem; }
        .widget-item { display: flex; gap: 12px; align-items: center; text-decoration: none; color: inherit; padding-bottom: 1rem; border-bottom: 1px solid #334155; cursor: pointer; }
        .widget-item:last-child { border-bottom: none; padding-bottom: 0; }
        .widget-img { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background-color: #334155; flex-shrink: 0; }
        .widget-text-container { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .widget-item-title { font-size: 0.9rem; font-weight: 600; color: #fff; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .widget-item-title:hover { color: var(--accent); }
        .widget-item-meta { font-size: 0.75rem; color: var(--text-muted); }

        /* Sosyal Medya Widget */
        .widget-socials { display: flex; gap: 10px; flex-wrap: wrap; }
        .w-social-btn { display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 8px; background-color: #0f172a; color: #fff; text-decoration: none; border: 1px solid #334155; transition: 0.2s; font-size: 1.2rem; }
        .w-social-btn:hover { background-color: var(--accent); border-color: var(--accent); transform: translateY(-3px); }

        /* Kategori Widget */
        .widget-categories { display: flex; flex-direction: column; gap: 8px; }
        .w-category-btn { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; color: var(--text-main); text-decoration: none; font-size: 0.95rem; font-weight: 600; transition: 0.2s; }
        .w-category-btn:hover { border-color: var(--accent); color: var(--accent); }

        .comments-section { background-color: var(--card-bg); border-radius: 12px; padding: 2rem; border: 1px solid #334155; }
        .comments-title { font-size: 1.5rem; margin-bottom: 1.5rem; color: #fff; border-bottom: 2px solid var(--accent); padding-bottom: 0.5rem; display: inline-block;}

        footer { background-color: var(--header-bg); border-top: 1px solid #334155; padding: 2rem 1rem; text-align: center; margin-top: auto; }
        .footer-content { max-width: 1200px; margin: 0 auto; color: var(--text-muted); font-size: 0.9rem; }
        .footer-links a { color: var(--text-muted); text-decoration: none; margin: 0 10px; }
        .footer-links a:hover { color: var(--accent); }
        
        .back-btn { display: inline-block; margin-bottom: 1rem; color: var(--accent); text-decoration: none; font-weight: bold; }
        .back-btn:hover { text-decoration: underline; }
        
        @media (max-width: 950px) {
            /* Tablete ve mobile geçildiğinde widget'ı alta atar ve yapışkanlığı kaldırır */
            .page-layout { grid-template-columns: 1fr; gap: 2rem; }
            .sidebar-area { position: static; }
        }

        @media (max-width: 768px) {
            .article-header { padding: 1.5rem; } 
            .article-sub-bar { padding: 1.2rem 1.5rem; } 
            .article-body { padding: 1.2rem; font-size: 1.05rem; }
            .article-title { font-size: 1.6rem; }
            .comments-section { padding: 1.2rem; }
            .article-source { text-align: left; }
            
            .social-share { flex-direction: column; align-items: flex-start; gap: 8px; }
            .share-text { margin-bottom: 4px; }
            .author-card { flex-direction: column; text-align: center; }
        }
    </style>
</head>

    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();

        let isPlaying = false;
        const synth = window.speechSynthesis;
        let checkSpeechInterval;
        window.benimUtterance = null;

        // YENİ EKLENEN FONKSİYON: Tarihleri Görece Formata Çevirir
        function getRelativeTime(dateString) {
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return dateString;

            const now = new Date();
            const diffInSeconds = Math.floor((now - date) / 1000);
            
            if (diffInSeconds < 0) return dateString;

            const diffInMinutes = Math.floor(diffInSeconds / 60);
            const diffInHours = Math.floor(diffInMinutes / 60);
            const diffInDays = Math.floor(diffInHours / 24);

            if (diffInDays === 0) {
                if (diffInHours > 0) return `${diffInHours} saat önce`;
                if (diffInMinutes > 0) return `${diffInMinutes} dakika önce`;
                return "Az önce";
            } else if (diffInDays === 1) {
                return "Dün";
            } else if (diffInDays < 7) {
                return `${diffInDays} gün önce`;
            } else if (diffInDays < 30) {
                const weeks = Math.floor(diffInDays / 7);
                return `${weeks} hafta önce`;
            } else if (diffInDays < 365) {
                const months = Math.floor(diffInDays / 30);
                return `${months} ay önce`;
            } else {
                const years = Math.floor(diffInDays / 365);
                return `${years} yıl önce`;
            }
        }

        function sesliOkuToggle() {
            const btn = document.getElementById('tts-btn');
            if (!('speechSynthesis' in window)) {
                alert("Tarayıcınız sesli okuma özelliğini desteklemiyor.");
                return;
            }

            if (isPlaying || synth.speaking) {
                synth.cancel(); 
                clearInterval(checkSpeechInterval);
                isPlaying = false;
                btn.innerHTML = '<i class="fa-solid fa-volume-high"></i> Haberi Sesli Dinle';
                btn.style.backgroundColor = 'var(--accent)';
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
                return;
            }

            const metin = document.getElementById('okunacak-metin').innerText;
            window.benimUtterance = new SpeechSynthesisUtterance(metin);
            window.benimUtterance.lang = 'tr-TR'; 
            window.benimUtterance.rate = 1.0;     
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Ses Hazırlanıyor...';
            btn.style.opacity = '0.7';
            btn.style.pointerEvents = 'none';

            window.benimUtterance.onend = function() {
                isPlaying = false;
                clearInterval(checkSpeechInterval);
                btn.innerHTML = '<i class="fa-solid fa-volume-high"></i> Haberi Sesli Dinle';
                btn.style.backgroundColor = 'var(--accent)';
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
            };

            window.benimUtterance.onerror = function() {
                isPlaying = false;
                clearInterval(checkSpeechInterval);
                btn.innerHTML = '<i class="fa-solid fa-volume-high"></i> Haberi Sesli Dinle';
                btn.style.backgroundColor = 'var(--accent)';
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
            };

            synth.speak(window.benimUtterance);

            let beklemeSuresi = 0;
            checkSpeechInterval = setInterval(() => {
                beklemeSuresi += 300;
                if (synth.speaking) {
                    clearInterval(checkSpeechInterval);
                    isPlaying = true;
                    btn.innerHTML = '<i class="fa-solid fa-stop"></i> Dinlemeyi Durdur';
                    btn.style.backgroundColor = '#ef4444';
                    btn.style.opacity = '1';
                    btn.style.pointerEvents = 'auto';
                } 
                else if (beklemeSuresi >= 12000) {
                    clearInterval(checkSpeechInterval);
                    synth.cancel(); 
                    alert("Kullandığınız tarayıcı (WebView) cihazın ses motoruna erişime izin vermiyor. Özelliği kullanmak için standart bir tarayıcı kullanın.");
                    isPlaying = false;
                    btn.innerHTML = '<i class="fa-solid fa-volume-high"></i> Haberi Sesli Dinle';
                    btn.style.backgroundColor = 'var(--accent)';
                    btn.style.opacity = '1';
                    btn.style.pointerEvents = 'auto';
                }
            }, 300);
        }

        window.addEventListener('beforeunload', () => {
            if (synth && synth.speaking) { synth.cancel(); }
        });

        const loadGiscus = () => {
            const container = document.getElementById('giscus-container');
            if (!container) return;
            const giscusScript = document.createElement('script');
            giscusScript.src = "https://giscus.app/client.js";
            giscusScript.setAttribute('data-repo', "KerimDemirkaynak/Yorumlar");
            giscusScript.setAttribute('data-repo-id', "R_kgDOPPm0QA");
            giscusScript.setAttribute('data-category', "Yorumlar");
            giscusScript.setAttribute('data-category-id', "DIC_kwDOPPm0QM4CtM73");
            giscusScript.setAttribute('data-mapping', "url");
            giscusScript.setAttribute('data-strict', "0");
            giscusScript.setAttribute('data-reactions-enabled', "1");
            giscusScript.setAttribute('data-emit-metadata', "0");
            giscusScript.setAttribute('data-input-position', "top");
            giscusScript.setAttribute('data-theme', "dark_dimmed"); 
            giscusScript.setAttribute('data-lang', "tr");
            giscusScript.setAttribute('crossorigin', "anonymous");
            giscusScript.async = true;
            container.appendChild(giscusScript);
        };

        function baglantiyiKopyala() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('Haber bağlantısı panoya kopyalandı!');
            }).catch(err => {
                console.error('Kopyalama başarısız:', err);
            });
        }

        async function widgetHaberleriYukle(currentHaberId) {
            try {
                const response = await fetch('liste.json');
                if (!response.ok) return;
                const tumHaberler = await response.json();
                
                // Gösterilen haber sayısını 5'ten 6'ya çıkardık
                const filtrelenmisHaberler = tumHaberler
                    .filter(h => h.id !== currentHaberId)
                    .slice(0, 6);

                const widgetContainer = document.getElementById('widget-news-container');
                widgetContainer.innerHTML = '';

                if (filtrelenmisHaberler.length === 0) {
                    widgetContainer.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">Başka haber bulunamadı.</p>';
                    return;
                }

                filtrelenmisHaberler.forEach(h => {
                    const imgHTML = h.resim 
                        ? `<img src="${h.resim}" alt="${h.baslik}" class="widget-img">`
                        : `<div class="widget-img" style="display:flex; align-items:center; justify-content:center; font-size:0.7rem; color:var(--text-muted); text-align:center; padding:2px;">${h.kaynak}</div>`;

                    const itemHTML = `
                        <a href="haber.html?id=${h.id}" class="widget-item">
                            ${imgHTML}
                            <div class="widget-text-container">
                                <h4 class="widget-item-title">${h.baslik}</h4>
                                <span class="widget-item-meta">${getRelativeTime(h.tarih)}</span>
                            </div>
                        </a>
                    `;
                    widgetContainer.innerHTML += itemHTML;
                });
            } catch (e) {
                console.error("Widget haberleri yüklenemedi:", e);
            }
        }

        async function haberiGetir() {
            const urlParams = new URLSearchParams(window.location.search);
            const haberId = urlParams.get('id');

            if (!haberId) {
                document.getElementById('news-content').innerHTML = '<div style="padding: 2rem; text-align: center;">Haber bulunamadı.</div>';
                return;
            }

            widgetHaberleriYukle(haberId);

            try {
                const response = await fetch(`haberler/${haberId}.json`);
                if (!response.ok) throw new Error('Haber dosyası bulunamadı.');
                const haber = await response.json();

                document.title = `${haber.baslik} - Kerimu Animasyon`;
                
                const DAKIKADA_KELIME = 200;
                const kelimeSayisi = haber.tamMetin.trim().split(/\s+/).length;
                const okumaSuresi = Math.ceil(kelimeSayisi / DAKIKADA_KELIME);

                let resimHTML = haber.resim ? `<img src="${haber.resim}" alt="${haber.baslik}" class="article-image">` : '';
                
                let formatlanmisMetin = haber.tamMetin
                    .split('\n')
                    .filter(p => p.trim().length > 0)
                    .map(p => `<p style="margin-bottom: 1.5rem; text-align: left;">${p.trim()}</p>`)
                    .join('');
                
                const sayfaUrl = encodeURIComponent(window.location.href);
                const sayfaBaslik = encodeURIComponent(haber.baslik);

                const paylasimHTML = `
                    <div class="social-share">
                        <span class="share-text">Haberi Paylaş:</span>
                        <div class="share-buttons-container">
                            <a href="https://twitter.com/intent/tweet?url=${sayfaUrl}&text=${sayfaBaslik}" target="_blank" class="share-btn btn-twitter" title="X'te (Twitter) Paylaş"><i class="fa-brands fa-x-twitter"></i></a>
                            <a href="https://www.facebook.com/sharer/sharer.php?u=${sayfaUrl}" target="_blank" class="share-btn btn-facebook" title="Facebook'ta Paylaş"><i class="fa-brands fa-facebook-f"></i></a>
                            <a href="https://api.whatsapp.com/send?text=${sayfaBaslik} - ${sayfaUrl}" target="_blank" class="share-btn btn-whatsapp" title="WhatsApp'tan Gönder"><i class="fa-brands fa-whatsapp"></i></a>
                            <a href="https://t.me/share/url?url=${sayfaUrl}&text=${sayfaBaslik}" target="_blank" class="share-btn btn-telegram" title="Telegram'da Paylaş"><i class="fa-brands fa-telegram"></i></a>
                            <button onclick="baglantiyiKopyala()" class="share-btn btn-copy" title="Bağlantıyı Kopyala"><i class="fa-solid fa-link"></i></button>
                        </div>
                    </div>
                `;
                
                document.getElementById('news-content').innerHTML = `
                    ${resimHTML}
                    <div class="article-header">
                        <h1 class="article-title">${haber.baslik}</h1>
                    </div>
                    
                    <div class="article-sub-bar">
                        <div class="author-meta-top">
                            <a href="https://github.com/KerimDemirkaynak" target="_blank">
                                <img src="https://avatars.githubusercontent.com/u/76594465?v=4&size=64" alt="Kerim Demirkaynak">
                            </a>
                            <div class="author-info">
                                <a href="https://github.com/KerimDemirkaynak" target="_blank" class="author-name">Kerim Demirkaynak</a>
                                <span class="author-date">${getRelativeTime(haber.tarih)}</span>
                            </div>
                        </div>
                        <div class="article-source">
                            <div style="margin-bottom: 4px;">Kaynak: <strong>${haber.kaynak}</strong></div>
                            <div style="margin-bottom: 4px;">Tür: <strong>${haber.kategori}</strong></div>
                            <div><i class="fa-regular fa-clock"></i> Okuma Süresi: <strong>${okumaSuresi} dk</strong></div>

                    </div>

                    <div class="article-body">
                        <button id="tts-btn" onclick="sesliOkuToggle()" style="display: inline-flex; align-items: center; gap: 8px; background-color: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-bottom: 1.5rem;"><i class="fa-solid fa-volume-high"></i> Haberi Sesli Dinle</button>
                        <div id="okunacak-metin">
                            ${formatlanmisMetin}
                        </div>
                        <a href="${haber.link}" target="_blank" class="original-link">Orijinal Habere Git <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
                        
                        ${paylasimHTML}

                        <div class="author-card">
                            <a href="https://github.com/KerimDemirkaynak" target="_blank">

                            </a>
                            <div class="author-card-text">

                                <p>Yazılım geliştirici, açık kaynak katılımcısı ve vibe coder. Anime dünyasına olan ilgisini teknolojiyle birleştirerek içerikler üretiyor.</p>
                            </div>
                        </div>
                    </div>
                `;

                if (!('speechSynthesis' in window)) {
                    const ttsBtn = document.getElementById('tts-btn');
                    if (ttsBtn) ttsBtn.style.display = 'none';
                }

                loadGiscus();
            } catch (error) {
                console.error("Hata:", error);
                document.getElementById('news-content').innerHTML = '<div style="padding: 2rem; text-align: center;">Haber metni yüklenemedi veya silinmiş olabilir.</div>';
            }
        }

        window.onload = haberiGetir;
    </script>
